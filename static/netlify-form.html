<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Contact</title>
	</head>
	<body>
		<form name="contact" method="POST" action="/netlify-form.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
			<input type="hidden" name="form-name" value="contact" />
			<input name="bot-field" />
			<input type="text" name="name" />
			<input type="email" name="email" />
			<textarea name="message"></textarea>
		</form>
	</body>
</html>
